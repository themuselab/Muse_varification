name: Threads Auto Publish

on:
  schedule:
    # KST → UTC (UTC = KST - 9h)
    # 2026-05-28 피벗: 슬롯 7개 → 3개로 축소 (페인 발굴 / 통찰 / 베타 모집)
    - cron: '0 0 * * *'   # 09:00 KST morning_pain
    - cron: '30 3 * * *'  # 12:30 KST lunch_insight
    - cron: '30 12 * * *' # 21:30 KST evening_recruit
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (morning_pain/lunch_insight/evening_recruit)'
        required: true
        default: 'morning_pain'

concurrency:
  group: threads-publish-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Determine slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 0 * * *")   SLOT=morning_pain ;;
            "30 3 * * *")  SLOT=lunch_insight ;;
            "30 12 * * *") SLOT=evening_recruit ;;
            *) SLOT="${{ github.event.inputs.slot }}" ;;
          esac
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "Running slot: $SLOT"

      - name: Call publish endpoint
        run: |
          set -e
          RESPONSE=$(curl -fsS "https://themuselab.kr/api/cron/post?slot=${{ steps.slot.outputs.slot }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP_STATUS=%{http_code}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS=" | cut -d= -f2)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Publish endpoint returned status $STATUS"
            exit 1
          fi
